# ====================================================================
# MoCo v2 + Multi-Crop — Cross-Resolution용 강화 baseline
# Goal: STL10 LP 80~84%, CIFAR10 LP 82~86% (현재 76.92 / 78.51 대비)
# 시간 예산: L4 22GB / 200 epoch / ≈ 60-70h
# ====================================================================

method: mocov2_mc

backbone:
  name: resnet50
  small_image: true            # 96×96 → 12×12 layer4 spatial (CIFAR-100 32×32에서 4×4 보존)
  zero_init_residual: true
  gradient_checkpoint: true
  gc_mode: all                 # multi-crop+R50+batch256은 layer3-only로 부족 → 전체 layer ckpt

data:
  root: ./data
  dataset: stl10_unlabeled
  image_size: 96               # ssl_lib/data/transforms.py와의 호환 키
  num_workers: 4               # Colab L4: 4 권장 (8은 hang 위험)
  persistent_workers: true
  download: true

augmentation:
  type: multicrop              # ★ 이 키가 multi-crop loader로 분기시킴
  # global crops
  global_crop_size: 96
  global_crop_scale: [0.4, 1.0]
  # local crops — CIFAR10 해상도와 동일 → cross-res invariance 직접 학습
  local_crop_size: 32
  local_crop_scale: [0.08, 0.4]
  n_local_crops: 4
  # color/blur policy (DINO/MoCo v3 표준)
  color_jitter: [0.4, 0.4, 0.2, 0.1]
  color_jitter_p: 0.8
  grayscale_p: 0.2
  gaussian_blur_p_global: [1.0, 0.1]   # global1=1.0, global2=0.1 (asymmetric)
  gaussian_blur_p_local: 0.5
  solarize_p_global2: 0.2              # global2에만 solarize

optimizer:
  name: sgd                    # MoCo v2 전통: SGD + momentum + linear lr scaling
  lr: 0.03                     # batch=256 기준
  momentum: 0.9
  weight_decay: 1.0e-4

schedule:
  epochs: 200
  warmup_epochs: 20            # multi-crop은 warmup 길게 (10→20)

training:
  batch_size: 256
  amp: true
  amp_dtype: bfloat16          # L4 native bf16, GradScaler 불필요
  compile: false               # multi-crop+R50 OOM 방지 → 비활성. 속도 ~10-15% 손실
  compile_mode: default
  channels_last: true
  grad_clip: null
  seed: 42
  log_every: 50
  save_every: 5                # Colab 끊김 대비 (≤ 30분 손실)
  keep_last_n_ckpts: 3

projection:
  hidden_dim: 2048
  output_dim: 128              # MoCo 표준
  num_layers: 2

mocov2:
  queue_size: 16384
  momentum: 0.999
  temperature: 0.15            # 0.2 → 0.15 (multi-crop은 sharper temp 선호)
  symmetric_loss: true

output:
  dir: ./outputs/mocov2_mc_r50_seed42
  log_file: ./logs/mocov2_mc_r50_seed42.log
